<style>
:root{--bg:#F5F4F0;--card:#FFFFFF;--text:#1F1E1C;--text2:#6B6A65;--border:rgba(31,30,28,.14);
--border-strong:rgba(31,30,28,.28);--danger:#A32D2D;--focus:rgba(55,138,221,.35);--accent:#534AB7}
@media (prefers-color-scheme:dark){:root{--bg:#1C1C1B;--card:#262624;--text:#F2F1EC;--text2:#A9A79F;
--border:rgba(255,255,255,.14);--border-strong:rgba(255,255,255,.28);--danger:#F09595;--accent:#7F77DD}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.card{max-width:400px;margin:56px auto;background:var(--card);border:0.5px solid var(--border);border-radius:12px;padding:20px 24px}
h1{font-size:18px;font-weight:500;margin:0 0 2px}
.lbl{font-size:13px;color:var(--text2);margin:0}
label.lbl{display:block;margin:16px 0 4px}
input[type=password]{width:100%;height:40px;padding:0 12px;font:inherit;font-size:16px;color:var(--text);background:transparent;border:0.5px solid var(--border-strong);border-radius:8px;outline:none}
input[type=password]:focus{border-color:#378ADD;box-shadow:0 0 0 3px var(--focus)}
.remember{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin:12px 0 16px}
.remember input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
button{width:100%;height:40px;font:inherit;font-size:16px;font-weight:500;color:#fff;background:var(--accent);border:none;border-radius:8px;cursor:pointer}
.err{font-size:13px;color:var(--danger);margin:10px 0 0;min-height:1em}
@media (max-width:520px){.card{margin:16px 12px;padding:18px}}
</style>
</head>

  <p class="lbl">Enter the password to open today's predictions.</p>

    <input type="password" id="pw" autocomplete="current-password" required>
    <label class="remember"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button type="submit" id="go">Unlock</button>
    <p class="err" id="err" aria-live="polite"></p>
  </form>

<script>
const P = JSON.parse(document.getElementById('payload').textContent);
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const STORE = 'match-predictor-key';
async function keyFrom(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(P.salt), iterations: P.rounds, hash: 'SHA-256'},
                                 base, {name: 'AES-GCM', length: 256}, true, ['decrypt']);
}
async function decrypt(key) {
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(P.iv)}, key, bytes(P.data));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
(async () => {
  const saved = localStorage.getItem(STORE);           // a key remembered on this device
  if (saved) {
    try {
      const key = await crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']);
      return show(await decrypt(key));
    } catch { localStorage.removeItem(STORE); }        // password changed: ask again
  }
  document.getElementById('pw').focus();
})();
document.getElementById('unlock').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  err.textContent = ''; go.textContent = 'Unlocking…';
  try {
    const key = await keyFrom(document.getElementById('pw').value);
    const html = await decrypt(key);
    if (document.getElementById('remember').checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      localStorage.setItem(STORE, btoa(String.fromCharCode(...raw)));
    }
    show(html);
  } catch {
    go.textContent = 'Unlock';
    err.textContent = "That password didn't work. Try again.";
  }
});
</script>
